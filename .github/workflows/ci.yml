name: ci

on:
  push:
    branches: [main, "etapa-*/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependências de desenvolvimento
        run: python -m pip install "pytest>=8" "jsonschema>=4.20"
      - name: Testes
        run: python -m pytest --junitxml=reports/junit.xml
      - name: Relatório JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/junit.xml
